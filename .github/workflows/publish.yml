name: Publish to PyPI

# Bump `version` in pyproject.toml (and gzw_data/__init__.py) and push to main.
# If that version is not on PyPI yet, this workflow tests, builds, publishes and tags it.
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Read the version and check PyPI
        id: meta
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -fsS "https://pypi.org/pypi/gzw-data/$version/json" > /dev/null 2>&1; then
            echo "gzw-data $version is already on PyPI, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        if: steps.meta.outputs.publish == 'true'
        run: python -m unittest discover -s tests
      - name: Build sdist and wheel
        if: steps.meta.outputs.publish == 'true'
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.publish == 'true'
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC), no API token needed
      contents: write # create the tag and GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
