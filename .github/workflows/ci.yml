name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build package
        run: |
          python -m pip install build
          python -m build

  live:
    # Scheduled check that the client still works against the real API.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Live smoke test
        run: |
          python - <<'PY'
          from gzw_data import GzwDataClient
          c = GzwDataClient()
          assert len(c.datasets()) > 10
          assert c.get("weapons", "ak-12")["name"] == "AK-12"
          assert c.get("weapons", "does-not-exist") is None
          print("ok")
          PY
